<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ef9fbd"><title>오늘의 고양이</title><link rel="stylesheet" href="style.css"><script src="cats.js" defer></script><script src="random.js" defer></script><script src="app.js" defer></script></head>
<body><main><div class="desktop-star star-one" aria-hidden="true">✷</div><div class="desktop-star star-two" aria-hidden="true">✦</div><section class="window" aria-label="오늘의 고양이"><header class="titlebar"><h1>오늘의 고양이</h1><button id="saved-open" aria-label="저장한 고양이" title="저장한 고양이">▦</button></header><div class="photo-wrap"><span class="tape" aria-hidden="true"></span><div class="photo-panel" aria-live="polite"><img id="cat-photo" alt="" src="images/cat-3.jpg"><div id="photo-error" role="alert" hidden>사진 로딩 실패</div></div><span class="sticker" aria-hidden="true">★</span></div><div class="controls"><button id="save-photo" class="square" aria-label="고양이 저장" aria-pressed="false" title="저장">♡</button><button id="next" aria-label="다른 고양이 보기" title="다른 고양이 · 스페이스바"><span aria-hidden="true">↻</span> 다음</button><a id="source" class="square" target="_blank" rel="noopener noreferrer" aria-label="사진 출처" title="사진 출처">↗</a></div><footer><a id="google" target="_blank" rel="noopener noreferrer" aria-label="Google에서 관련 이미지 검색">Google ↗</a><span aria-hidden="true">·</span><a id="pinterest" target="_blank" rel="noopener noreferrer" aria-label="Pinterest에서 관련 이미지 검색">Pinterest ↗</a></footer></section></main><dialog id="modal"><header class="titlebar"><h2>♡</h2><button id="modal-close" aria-label="닫기">×</button></header><div id="modal-body"></div></dialog><div id="toast" role="status" hidden></div></body></html>
